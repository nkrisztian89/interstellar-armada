<div class="innerContainer">
    <div class="separatorBar">
        <h1 id="title" class="translatable"></h1>
    </div>
    <div class="multiLobby pageContent">
        <div class="lobbyMainContainer">
            <div class="lobbyLeftColumn">
                <div class="playersContainer">
                    <table class="multiPlayers outerContainer">
                        <thead>
                            <tr>
                                <th id="playerNameColumn" class="translatable"></th>
                                <th>&nbsp;</th>
                                <th id="spacecraftColumn" class="translatable"></th>
                                <th id="connectionColumn" class="translatable"></th>
                                <th id="pingColumn" class="translatable"></th>
                                <th id="readyColumn" class="translatable"></th>
                                <th id="kickColumn" class="actionsColumn">&nbsp;</th>
                            </tr>
                        </thead>
                        <tbody id="playersList">
                        </tbody>
                    </table>
                </div>
                <div class="chatContainer">
                    <div id="chatLog" class="chatLog"></div>
                    <div class="chatInputRow">
                        <div class="chatMessageContainer">
                            <input id="chatMessage" class="chatMessage" type="text">
                            <span id="remainingMessageChars" class="remainingMessageChars"></span>
                        </div>
                        <button id="chatSend" class="chatSend translatable"></button>
                    </div>
                </div>
            </div>
            <div class="settingsContainer">
                <div class="settingsInfoRow">
                    <div id="gameNameLabel" class="smallSelectorPropertyContainer translatable"></div>
                    <div id="gameNameValue" class="settingsInfoValue"></div>
                </div>
                <div class="settingsInfoRow">
                    <div id="gameModeLabel" class="smallSelectorPropertyContainer translatable"></div>
                    <div id="gameModeValue" class="settingsInfoValue"></div>
                </div>
                <div id="hostSettings" class="hostSettings">
                </div>
                <div id="guestSettings">
                    <div id="difficultyContainer" class="settingsInfoRow">
                        <div id="difficultyLabel" class="smallSelectorPropertyContainer translatable"></div>
                        <div id="difficultyValue" class="settingsInfoValue"></div>
                    </div>
                    <div class="settingsInfoRow">
                        <div id="locationLabel" class="smallSelectorPropertyContainer translatable"></div>
                        <div id="locationValue" class="settingsInfoValue"></div>
                    </div>
                    <div class="settingsInfoRow">
                        <div id="loadoutLabel" class="smallSelectorPropertyContainer translatable"></div>
                        <div id="loadoutValue" class="settingsInfoValue"></div>
                    </div>
                    <div id="enemiesPerWaveContainer" class="settingsInfoRow">
                        <div id="enemiesPerWaveLabel" class="smallSelectorPropertyContainer translatable"></div>
                        <div id="enemiesPerWaveValue" class="settingsInfoValue"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer separatorBar">
        <div class="horizontallyCentered horizontalMenu" >
            <button id="leaveButton" class="translatable"></button>
            <button id="readyButton" class="translatable"></button>
            <button id="startButton" class="translatable"></button>
        </div>
    </div>
</div>
